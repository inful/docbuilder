version: "2"

linters:
  default: none
  disable:
    - dogsled
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - gocritic
    - gocyclo
    - gosec
    - godoclint
    - godot
    #- godox
    - goheader
    - goprintffuncname
    - govet
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    # - mnd
    - modernize
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - sloglint
    - staticcheck
    - tagalign
    - thelper
    - usetesting
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - whitespace
  settings:
    tagalign:
      sort: true
      strict: false
      align: false
      order:
        - "cmd"
        - "short"
        - "name"
        - "default"
        - "env"
        - "help"
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - performance
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    perfsprint:
      strconcat: false
    revive:
      rules:
        - name: unused-parameter
          disabled: true
    unused:
      field-writes-are-uses: false
      post-statements-are-reads: true
      exported-fields-are-used: false
      local-variables-are-used: false
      generated-is-used: false

# Pass H6 of cleanup migration. forbidigo is configured (above) to
# ban fmt.Errorf in production code. As packages migrate to
# foundation/errors they are removed from the exclusion list below.
# Remove a line whenever you finish migrating a package.
#
# Migrated (not excluded, must pass the rule):
#   internal/state/, internal/linkverify/,
#   internal/templates/sequence.go, internal/forge/enhanced_mock.go,
#   internal/hugo/indexes.go, internal/build/delta/manager.go,
#   internal/config/composite_defaults.go, internal/daemon/daemon.go.
issues:
  exclude-dirs-use-default: false
  exclude-dirs:
    - cmd
  exclude-files:
    - internal/auth/.*\.go$
    - internal/daemon/(daemon_postbuild|event_emitter|scheduler)\.go$
    - internal/docs/.*\.go$
    - internal/doctemplate/.*\.go$
    - internal/forge/(discoveryrunner|helpers)\.go$
    - internal/foundation/normalization/.*\.go$
    - internal/git/.*\.go$
    - internal/hugo/(categories_menu|config_writer|content_copy_pipeline|generator|models|modules|pipeline|stages|structure)\.go$
    - internal/hugo/stages_transition_test\.go$
    - internal/lint/.*\.go$
    - internal/linkverify/extractor\.go$
    - internal/markdown/.*\.go$
    - internal/server/httpserver/(http_server|http_server_webhook)\.go$
    - internal/templates/(discovery|http_fetch|inputs|output_path|render|schema|template_page|writer)\.go$
    - internal/versioning/.*\.go$
    - internal/workspace/.*\.go$
  exclude-rules:
    # The old //nolint:forbidigo directives in cmd/ now target fmt.Println;
    # forbidigo fmt.Errorf never matches in those functions, so the
    # comments are unused. Silence the unused-directive complaints from nolintlint.
    - linters: [nolintlint]
      path: 'cmd/docbuilder/commands/(build|init)\.go$'
    - linters: [nolintlint]
      path: 'examples/tools/debug_webhook\.go$'

formatters:
  enable:
    # - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(git.home.luguber.info/inful/docbuilder)