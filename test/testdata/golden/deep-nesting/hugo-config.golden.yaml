baseURL: http://localhost:1313
defaultContentLanguage: en
description: Testing deeply nested directory structures
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_deep_nesting
          name: deep-nesting
          parent: cat_x__uncategorized_top
        - name: Root Level
          pageRef: /root/
          parent: cat_x__uncategorized_deep_nesting
          weight: 1
        - name: Level 1
          pageRef: /level1/doc/
          parent: cat_x__uncategorized_deep_nesting
          weight: 2
        - name: Level 2
          pageRef: /level1/level2/doc/
          parent: cat_x__uncategorized_deep_nesting
          weight: 3
        - name: Level 3
          pageRef: /level1/level2/level3/doc/
          parent: cat_x__uncategorized_deep_nesting
          weight: 4
        - name: Level 4
          pageRef: /level1/level2/level3/level4/deep-doc/
          parent: cat_x__uncategorized_deep_nesting
          weight: 5
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    tag: tags
title: Deep Nesting Test
