baseURL: http://localhost:1313
defaultContentLanguage: en
description: Testing graceful handling of invalid YAML in front matter
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                        - - $
                          - $
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_malformed_frontmatter
          name: malformed-frontmatter
          parent: cat_x__uncategorized_top
        - name: invalid-yaml
          pageRef: /invalid-yaml/
          parent: cat_x__uncategorized_malformed_frontmatter
        - name: Valid Document
          pageRef: /valid/
          parent: cat_x__uncategorized_malformed_frontmatter
          weight: 10
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    project: projects
    tag: tags
title: Malformed Front Matter Test
