baseURL: http://localhost
defaultContentLanguage: en
description: Testing handling of same-named files from different repos
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_repo_a
          name: repo-a
          parent: cat_x__uncategorized_top
        - name: Setup Guide (Repository A)
          pageRef: /repo-a/setup/
          parent: cat_x__uncategorized_repo_a
          weight: 1
        - name: API Documentation (Repository A)
          pageRef: /repo-a/api/
          parent: cat_x__uncategorized_repo_a
          weight: 2
        - identifier: cat_x__uncategorized_repo_b
          name: repo-b
          parent: cat_x__uncategorized_top
        - name: Setup Guide (Repository B)
          pageRef: /repo-b/setup/
          parent: cat_x__uncategorized_repo_b
          weight: 1
        - name: Tutorial (Repository B)
          pageRef: /repo-b/tutorial/
          parent: cat_x__uncategorized_repo_b
          weight: 2
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    project: project
    tag: tags
title: Conflicting Paths Test
