baseURL: http://localhost:1313/
defaultContentLanguage: en
description: Test uid/alias based permalink ref shortcode injection
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_test_repo
          name: test-repo
        - name: With Alias No UID
          pageRef: /with-alias-no-uid/
          parent: cat_x__uncategorized_test_repo
        - name: With UID Wrong Alias
          pageRef: /with-uid-wrong-alias/
          parent: cat_x__uncategorized_test_repo
        - name: With UID and Alias
          pageRef: /with-uid-and-alias/
          parent: cat_x__uncategorized_test_repo
        - name: With UID and Alias Already Has Line
          pageRef: /with-uid-and-alias-already-has-line/
          parent: cat_x__uncategorized_test_repo
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    tag: tags
title: UID Permalink Ref Test
