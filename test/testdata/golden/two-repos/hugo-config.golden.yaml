baseURL: http://localhost
defaultContentLanguage: en
description: Testing multi-repository aggregation
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_repository_one
          name: repository-one
          parent: cat_x__uncategorized_top
        - name: Getting Started Guide
          pageRef: /repository-one/guide/
          parent: cat_x__uncategorized_repository_one
          weight: 1
        - name: API Reference
          pageRef: /repository-one/api/
          parent: cat_x__uncategorized_repository_one
          weight: 2
        - identifier: cat_x__uncategorized_repository_two
          name: repository-two
          parent: cat_x__uncategorized_top
        - name: Advanced Tutorial
          pageRef: /repository-two/tutorial/
          parent: cat_x__uncategorized_repository_two
          weight: 1
        - name: Deployment Guide
          pageRef: /repository-two/deployment/
          parent: cat_x__uncategorized_repository_two
          weight: 2
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    project: projects
    tag: tags
title: Multi-Repo Documentation
