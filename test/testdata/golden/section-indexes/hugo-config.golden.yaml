baseURL: http://localhost
defaultContentLanguage: en
description: Testing automatic _index.md generation for sections
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_section_docs
          name: section-docs
          parent: cat_x__uncategorized_top
        - name: Custom Themes
          pageRef: /advanced/themes/
          parent: cat_x__uncategorized_section_docs
          weight: 1
        - name: Installation
          pageRef: /getting-started/installation/
          parent: cat_x__uncategorized_section_docs
          weight: 1
        - name: Configuration
          pageRef: /getting-started/configuration/
          parent: cat_x__uncategorized_section_docs
          weight: 2
        - name: Plugin System
          pageRef: /advanced/plugins/
          parent: cat_x__uncategorized_section_docs
          weight: 2
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    tag: tags
title: Section Index Testing
