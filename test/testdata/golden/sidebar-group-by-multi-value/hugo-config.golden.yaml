baseURL: http://localhost:1313/
defaultContentLanguage: en
description: Testing hugo.sidebar.group_by fan-out on list-valued project
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                        - - $
                          - $
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        lineNumbersInTable: false
        noClasses: false
        style: github
        tabWidth: 4
module:
    imports:
        - path: github.com/docsy/docsy/theme
          version: v0.18.1
outputs:
    home:
        - HTML
        - RSS
params:
    offlineSearch: true
    ui:
        showLightDarkModeMenu: true
        sidebar_menu_foldable: true
taxonomies:
    category: categories
    project: projects
    tag: tags
title: Sidebar Group By Multi-Value Demo
