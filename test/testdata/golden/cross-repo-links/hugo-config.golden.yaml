baseURL: http://localhost
defaultContentLanguage: en
description: Testing link transformation between repositories
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_backend
          name: backend
          parent: cat_x__uncategorized_top
        - name: Backend API
          pageRef: /backend/api/
          parent: cat_x__uncategorized_backend
          weight: 1
        - name: Backend Authentication
          pageRef: /backend/auth/
          parent: cat_x__uncategorized_backend
          weight: 2
        - identifier: cat_x__uncategorized_frontend
          name: frontend
          parent: cat_x__uncategorized_top
        - name: Frontend Guide
          pageRef: /frontend/guide/
          parent: cat_x__uncategorized_frontend
          weight: 1
        - name: Frontend Setup
          pageRef: /frontend/setup/
          parent: cat_x__uncategorized_frontend
          weight: 2
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    editURL: {}
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    project: projects
    tag: tags
title: Cross-Repository Links
