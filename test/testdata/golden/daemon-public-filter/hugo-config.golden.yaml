baseURL: http://localhost:1313/
defaultContentLanguage: en
description: Testing daemon public-only filtering
enableGitInfo: false
languages:
    en:
        languageName: English
        weight: 1
markup:
    goldmark:
        extensions:
            passthrough:
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
                enable: true
        parser:
            attribute:
                block: true
        renderer:
            unsafe: true
    highlight:
        lineNos: true
        noClasses: false
        style: github
        tabWidth: 4
menu:
    announcements:
        - identifier: cat_announcements_top
          name: Announcements
        - identifier: cat_announcements_public_filter_repo
          name: public-filter-repo
          parent: cat_announcements_top
        - name: public-announcement
          pageRef: /public-announcement/
          parent: cat_announcements_public_filter_repo
    x__uncategorized:
        - identifier: cat_x__uncategorized_top
          name: Uncategorized
        - identifier: cat_x__uncategorized_public_filter_repo
          name: public-filter-repo
          parent: cat_x__uncategorized_top
        - name: nested-public
          pageRef: /other/nested-public/
          parent: cat_x__uncategorized_public_filter_repo
        - name: public-page
          pageRef: /public-page/
          parent: cat_x__uncategorized_public_filter_repo
module:
    imports:
        - path: github.com/McShelby/hugo-theme-relearn
          version: 9.0.3
outputs:
    home:
        - HTML
        - RSS
        - JSON
    taxonomy:
        - HTML
        - JSON
    term:
        - HTML
        - JSON
params:
    alwaysopen: false
    collapsibleMenu: true
    disableBreadcrumb: false
    disableGeneratorVersion: false
    disableLandingPageButton: true
    disableLanguageSwitchingButton: true
    disableShortcutsTitle: false
    disableTagHiddenPages: false
    math:
        enable: true
    mermaid:
        enable: true
    showVisitedLinks: true
    sidebarmenus:
        - disableTitle: false
          identifier: x__uncategorized
          type: menu
          weight: 999
        - disableTitle: false
          identifier: announcements
          type: menu
        - identifier: main
          pageRef: /
          type: page
    themeVariant:
        - auto
        - zen-light
        - zen-dark
    themeVariantAuto:
        - zen-light
        - zen-dark
taxonomies:
    category: categories
    project: projects
    tag: tags
title: Public Filter Demo
