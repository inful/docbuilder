# Example DocBuilder Configuration with the Docsy theme
version: "2.0"

repositories:
  - name: my-docs
    url: https://github.com/example/documentation.git
    branch: main
    paths:
      - docs

hugo:
  title: "Documentation Site"
  description: "Technical documentation powered by the Hugo Docsy theme"
  base_url: "https://docs.example.com"

  params:
    # The theme's offline search index. DocBuilder turns it on by
    # default; set it to false to use an external search instead.
    offlineSearch: true

    # The theme's user interface. The light/dark switch and the
    # foldable sidebar are on by default.
    ui:
      showLightDarkModeMenu: true
      sidebar_menu_foldable: true

    # The navigation chrome: "full" renders it on every page,
    # "shared" renders it on the donor page only and restores it in
    # the browser. The shared mode is experimental, so it is opt-in.
    # See docs/reference/configuration.md.
    # td:
    #   chrome: shared

    # Mermaid diagrams
    mermaid:
      enable: true

    # Math support (MathJax)
    math:
      enable: true

output:
  directory: "./site"
  clean: true
