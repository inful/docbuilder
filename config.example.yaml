# Example configuration for docbuilder
forges:
  - name: "company-github"
    type: github
    api_url: https://api.github.com
    base_url: https://github.com
    organizations:
      - your-org
    # To enumerate every accessible org instead of listing them explicitly, you may remove
    # organizations: and set options.auto_discover: true (use with caution for large tokens):
    # options:
    #   auto_discover: true
    auth:
      type: token
      token: "${GITHUB_TOKEN}"

repositories:
  - url: https://git.home.luguber.info/inful/go-test-project.git
    name: go-test-project
    branch: main
    paths: [docs]
    auth:
      type: token
      token: "${GIT_ACCESS_TOKEN}"
build:
  # Optional persistent workspace for cloned repositories.
  # If omitted and base_directory is set, defaults to {base_directory}/workspace.
  # If omitted and base_directory is not set, defaults to ./site/_workspace.
  # Place outside output.directory to persist clones between builds for faster incremental updates.
  workspace_dir: ./site/_workspace
  # For documentation sites, shallow clones are typically sufficient and much faster/lower memory.
  # Set to 0 to disable shallow cloning.
  shallow_depth: 1
  # If true and local branch diverged from origin, perform hard reset to remote head.
  # Default: true (set false if you prefer divergence to fail the build).
  hard_reset_on_diverge: true

# Optional daemon configuration (enables scheduled sync/discovery and admin/webhook servers)
daemon:
  sync:
    schedule: "0 */4 * * *"         # Cron schedule (5-field)
    build_on_discovery: true        # Set false to discover without enqueuing builds
  build_debounce:
    quiet_window: "10s"             # Debounce window for non-immediate requests
    max_delay: "60s"                # Max time before forcing a build (must be >= quiet_window)
    webhook_immediate: true         # Webhooks bypass quiet window but still coalesce while a build is running
  storage:
    repo_cache_dir: "./daemon-data/repos"
  # Outbound integrations (daemon-mode-only, opt-in).
  # Leaving the block out entirely disables every outbound hook.
  outbound:
    # Push each generated document to ragabast's async-ingest endpoint so a
    # RAG index stays in sync with newly built docs. Daemon-only; one-shot
    # `docbuilder build` invocations never construct the dispatcher.
    ragabast:
      enabled: false                # must be explicitly true to fire
      # ragabast_base_url is the ragabast host (scheme+host only). The
      # dispatcher derives both endpoints from this single value:
      #   upload:    POST {ragabast_base_url}/api/ingest/file
      #   preflight: GET  {ragabast_base_url}/api/documents/<uid>/fingerprint
      # Path components are stripped, so you cannot accidentally POST to
      # "/" by forgetting one.
      ragabast_base_url: "https://ragabast.example.com"
      # Name of the env var that holds the bearer token. Read at daemon
      # startup; never logged or written to disk. Empty / unset = anonymous.
      auth_token_env: "RAGABAST_INGEST_TOKEN"
      workers: 4                    # concurrent POST goroutines
      queue_size: 256               # in-memory buffer; overflow drops (with counter)
      timeout: "10s"                # per-POST HTTP timeout
      # Base URL used to build the preflight GET <base>/api/documents/<uid>/fingerprint.
      # When empty (the default), docbuilder uses ragabast_base_url. Set this
      # only if preflight should hit a different host than the upload (rare).
      # preflight_base_url: "https://ragabast.example.com"
      # Toggle the fingerprint preflight. When unset, preflight is on whenever a
      # base URL resolves. Set to false to always POST every doc.
      # preflight_enabled: true
      # DEPRECATED: ingest_url was the full endpoint URL in v0.19.0 and earlier.
      # docbuilder still accepts it for backward compatibility — the path is
      # stripped and the host is used as the base — but it logs a deprecation
      # warning at startup. Migrate by removing this line and relying on
      # ragabast_base_url above.
      # ingest_url: "https://ragabast.example.com/api/ingest/file"
hugo:
  title: "My Documentation Site"
  description: "Aggregated documentation from multiple repositories"
  base_url: "https://docs.example.com"
  theme: "relearn"
  
  # Optional: Enable smooth page transitions
  # enable_page_transitions: true
  
  params:
    search:
      enable: true
      type: flexsearch
    theme:
      default: system
      displayToggle: true
    mermaid: {}
  menu:
    main:
      - name: "Home"
        url: "/"
        weight: 10
      - name: "API"
        url: "/api/"
        weight: 20

output:
  # Optional: Base directory for all build artifacts (useful for Kubernetes volume mounts)
  # When set:
  #   - Output: {base_directory}/{directory}
  #   - Staging: {base_directory}/staging
  #   - Workspace: {base_directory}/workspace (if workspace_dir not explicitly set)
  # base_directory: "/mnt/docs"
  directory: "./site"
  clean: true

# Linter configuration. Optional; when absent, the linter applies the built-in
# cross-forge union of git-forge-conventional excludes (README, CONTRIBUTING,
# SECURITY, CHANGELOG, LICENSE, and variants across GitHub / GitLab / Forgejo).
# See docs/reference/configuration.md#lint-section for the full default list.
lint:
  excludes:
    # README — universal across GitHub, GitLab, Forgejo
    - "README.md"
    - "README"
    - "README.rst"
    - "README.txt"
    - "README.adoc"
    # Contributing guidelines
    - "CONTRIBUTING.md"
    - "CONTRIBUTING"
    # Security policy — GitHub Security tab + GitLab auto-detected
    - "SECURITY.md"
    - "SECURITY"
    # Code of conduct — GitHub community health
    - "CODE_OF_CONDUCT.md"
    - "CODE_OF_CONDUCT"
    # Support resources — GitHub community health
    - "SUPPORT.md"
    # Changelog — linked from Releases on GitHub/GitLab
    - "CHANGELOG.md"
    - "CHANGELOG"
    # License — auto-detected by every forge
    - "LICENSE"
    - "LICENSE.md"
    - "LICENSE.txt"
    - "LICENSE.rst"
    - "COPYING"
    - "COPYING.md"
    # Authors / credits
    - "AUTHORS"
    - "AUTHORS.md"
    - "CONTRIBUTORS"
    - "CONTRIBUTORS.md"
    # Legal notices
    - "NOTICE"
    - "NOTICE.md"
    # GitHub template directories
    - ".github/ISSUE_TEMPLATE/**/*.md"
    - ".github/PULL_REQUEST_TEMPLATE.md"
    # GitLab template directories
    - ".gitlab/issue_templates/*.md"
    - ".gitlab/merge_request_templates/*.md"
    # Forgejo / Gitea template directories
    - ".gitea/ISSUE_TEMPLATE/**/*.md"
    - ".gitea/PULL_REQUEST_TEMPLATE.md"