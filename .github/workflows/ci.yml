name: CI

# Cancel outdated runs to save time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The runner's Go. The toolchain directive in go.mod decides the
        # version the build actually uses (go1.26.11), so the matrix
        # value is the starting point, not the version under test.
        go-version: ['1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binary for integration tests
        run: mkdir -p bin && go build -o bin/docbuilder ./cmd/docbuilder

      - name: Cache Hugo
        id: cache-hugo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/hugo
          key: hugo-0.170.1-linux-amd64

      - name: Install Hugo
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          HUGO_VERSION="0.170.1"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          mkdir -p /tmp/hugo
          mv hugo /tmp/hugo/

      - name: Add Hugo to PATH
        run: |
          sudo cp /tmp/hugo/hugo /usr/local/bin/
          hugo version

      - name: Run tests with race detector
        run: go test -v -race ./...

      # - name: Run tests with coverage
      #   run: go test -v -coverprofile=coverage.out -covermode=count ./...

      # - name: Upload coverage
      #   if: matrix.go-version == '1.24'
      #   uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
      #   with:
      #     file: ./coverage.out
      #     fail_ci_if_error: false
      #   continue-on-error: true

  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo
        id: cache-hugo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/hugo
          key: hugo-0.170.1-linux-amd64

      - name: Install Hugo
        if: steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          HUGO_VERSION="0.170.1"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          mkdir -p /tmp/hugo
          mv hugo /tmp/hugo/

      - name: Add Hugo to PATH
        run: |
          sudo cp /tmp/hugo/hugo /usr/local/bin/
          hugo version

      - name: Run golden tests
        run: go test -v -timeout=10m ./test/integration -run=TestGolden

      - name: Check for uncommitted golden files
        if: failure()
        run: |
          if git diff --quiet test/testdata/golden/; then
            echo "✅ Golden files are up to date"
          else
            echo "❌ Golden files were modified during test execution!"
            echo ""
            echo "This usually means:"
            echo "1. Code changes affected output but golden files weren't updated"
            echo "2. Tests were run with -update-golden locally but changes not committed"
            echo ""
            echo "Changed files:"
            git diff --name-only test/testdata/golden/
            echo ""
            echo "To fix: run 'go test ./test/integration -update-golden' and commit the changes"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.14.0
          args: --timeout=5m
          skip-cache: false

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          go build -v -o docbuilder ./cmd/docbuilder
          ./docbuilder --version
          ./docbuilder --help

  docs-generation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        id: docs_changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
            if echo "$FILES" | grep -qE '^(docs/|cmd/docbuilder/commands/(build|preview)|internal/hugo/)'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.docs_changed.outputs.changed == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Hugo
        if: steps.docs_changed.outputs.changed == 'true'
        id: cache-hugo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/hugo
          key: hugo-0.170.1-linux-amd64

      - name: Install Hugo
        if: steps.docs_changed.outputs.changed == 'true' && steps.cache-hugo.outputs.cache-hit != 'true'
        run: |
          HUGO_VERSION="0.170.1"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          mkdir -p /tmp/hugo
          mv hugo /tmp/hugo/

      - name: Add Hugo to PATH
        if: steps.docs_changed.outputs.changed == 'true'
        run: |
          sudo cp /tmp/hugo/hugo /usr/local/bin/
          hugo version

      - name: Build DocBuilder
        if: steps.docs_changed.outputs.changed == 'true'
        run: go build -v -o docbuilder ./cmd/docbuilder

      - name: Generate documentation site
        if: steps.docs_changed.outputs.changed == 'true'
        run: |
          ./docbuilder build \
            --docs-dir ./docs \
            --output ./public \
            --title "DocBuilder Documentation" \
            --base-url "https://${{ github.repository_owner }}.github.io/docbuilder" \
            --render-mode always

          # Verify the site was generated (Hugo creates public/ subdirectory)
          test -d public/public || (echo "Public directory not created" && exit 1)
          test -f public/public/index.html || (echo "index.html not created" && exit 1)

          # Verify the theme is the one the build ships: the stylesheet
          # is vendored, so its presence proves the theme was applied.
          ls public/public/css/docsy.min.*.css >/dev/null 2>&1 || \
            (echo "The Docsy stylesheet is missing from the build" && exit 1)
          grep -q "td-sidebar" public/public/index.html || \
            (echo "The theme's navigation is missing from the built page" && exit 1)

      - name: Upload generated site as artifact
        if: steps.docs_changed.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-docs-site
          path: public/public/
          retention-days: 3

      - name: Site generation summary
        if: steps.docs_changed.outputs.changed == 'true'
        run: |
          echo "## 📚 Documentation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully generated static documentation site!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Content files**: $(find docs -name '*.md' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated pages**: $(find public -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Site size**: $(du -sh public | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Structure" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tree -L 2 public || ls -la public >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for Docker image
        run: |
          # The Dockerfile's "binary" stage copies pre-built GoReleaser
          # artifacts from dist/ and looks for
          # dist/docbuilder_${TARGETOS}_${TARGETARCH}*/docbuilder.
          # This job builds linux/amd64, so produce that layout here.
          mkdir -p dist/docbuilder_linux_amd64_v1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o dist/docbuilder_linux_amd64_v1/docbuilder ./cmd/docbuilder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (test only, no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64
          target: runtime-minimal
          push: false
          load: true
          tags: docbuilder:smoke
          cache-from: type=gha,scope=buildkit-test
          cache-to: type=gha,mode=max,scope=buildkit-test
          provenance: false
          sbom: false

      - name: Run the image (smoke test)
        run: ./scripts/docker-smoke.sh docbuilder:smoke
